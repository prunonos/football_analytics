experiment: own_top1
experiment_id: own_top1_template
description: "template del config file de top1 con DL (TFG)"
enable: True
queue: cola1
priority: 1
variables: &variables
  # _aux_: 0
  select: 32
data:
  <<: *variables
  aggregations:
    Points: mean
    FTG: mean
    FTG_rival: mean
    S: mean
    ST: mean
    F: mean
    C: mean
    Y: mean
    R: mean
    # O: mean
    # HW: mean
    Side: mean
  features:
    - 4
    - 30 # el maximo no puede superior al numero de samples
  leagues:
    -
  lags:
    - 15D
    - 30D
    - 60D
    - 180D
    - 365D
    - 730D
    - 1825D
  min_samples:
    - 1
    - 2
    - 2
    - 8
    - 10
    - 15
    - 15
  col_group: 
    - "idTeam"
  col_window: "Date"
  sample: "random"
  balance: False
  factor: True
  init_date: "1996-07-01"
  val_date: "2017-01-01"
  exclusions:
    - long_term
    - short_term
paths:
  data: "datasets/data_train/data_"
  raw_data: "datasets/raw_datasets/datalake.csv"
  dtypes_path: "datasets/raw_datasets/dtypes.json"
  page_rank: "datasets/raw_datasets/page_rank.csv"
  match_importance: "datasets/raw_datasets/match_importance.csv"
training:
  <<: *variables
  max_epochs: 1
  patience: 1
  iterations: 2
  timeout: 1440      # in mins
  direction: "maximize"
  eval_metric: "val_accuracy"
  batch_size: 
    # - 8
    - 16
    # - 32
    # - 64
    # - 128
    # - 256