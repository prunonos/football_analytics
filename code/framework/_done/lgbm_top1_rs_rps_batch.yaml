data:
  exclusions:
  - page_rank_lags
  - pi_ratings
  init_date: '1996-07-01'
  sample: random
  save_data: true
  select: 64
  val_date: '2017-01-01'
description: template del config file de top1 con sampling random
enable: true
experiment: lgbm_top1
experiment_id: lgbm_top1_rs_rps_batch
paths:
  data: datasets/data_train/data_
  dtypes_path: datasets/raw_datasets/dtypes.json
  match_importance: datasets/raw_datasets/match_importance_v1.csv
  page_rank: datasets/raw_datasets/page_rank_v1.csv
  raw_data: datasets/raw_datasets/datalake.csv
priority: 1
queue: batch
training:
  batch_size:
  - 8
  - 16
  - 32
  - 64
  direction: minimize
  eval_metric: rps
  iterations: 20
  max_epochs: 100
  select: 64
  stopping_rounds: 15
  timeout: 3600
