experiment: top1
experiment_id: piRating_random_batch
description: "template del config file de top1 con sampling random"
enable: False
queue: cola1
priority: 3
variables: &variables
  # _aux_: 0
  select: 10000
data:
  <<: *variables
  sample: "random"
  # balance: True
  init_date: "1996-07-01"
  val_date: "2017-01-01"
  save_data: False
  exclusions:
    -
paths:
  data: "datasets/data_train/data_"
  raw_data: "datasets/raw_datasets/datalake.csv"
  dtypes_path: "datasets/raw_datasets/dtypes.json"
  page_rank: "datasets/raw_datasets/page_rank.csv"
  match_importance: "datasets/raw_datasets/match_importance.csv"
training:
  <<: *variables
  # metric: "test_accuracy"
  iterations: 2
  timeout: 700
  direction: "minimize"
  stopping_rounds: 2
