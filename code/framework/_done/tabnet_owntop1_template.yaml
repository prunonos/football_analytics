experiment: tabnet_owntop1
experiment_id: tabnet_owntop1_template
description: "experimento con el Dataset Top1 y Tabnet"
enable: True
variables: &variables
  _aux_: 0
  select: 16
data:
  <<: *variables
  aggregations:
    Points: mean
    FTG: mean
    FTG_rival: mean
    S: mean
    ST: mean
    F: mean
    C: mean
    Y: mean
    R: mean
    # O: mean
    # HW: mean
    Side: mean
  features:
    -
  leagues:
    -
  lags:
    - 15D
    - 30D
    - 60D
    - 180D
    - 365D
    - 730D
    - 1825D
  min_samples:
    - 1
    - 2
    - 2
    - 8
    - 10
    - 15
    - 15
  col_group: 
    - "idTeam"
  col_window: "Date"
  sample: "sequential"
  init_date: "1996-07-01"
  val_date: "2017-01-01"
  exclusions:
    - long_term
    - short_term
paths:
  data: "datasets/data_train/data_"
  raw_data: "datasets/raw_datasets/datalake.csv"
  dtypes_path: "datasets/raw_datasets/dtypes.json"
  page_rank: "datasets/raw_datasets/page_rank.csv"
  match_importance: "datasets/raw_datasets/match_importance.csv"
training:
  <<: *variables
  unsupervised_training: True
  # metric: "test_accuracy"
  max_epochs: 2
  patience: 1
  iterations: 2
  timeout: 1440      # in mins
  direction: "maximize"
  eval_metric:
    - "logloss"
    - "balanced_accuracy"
    - "accuracy"